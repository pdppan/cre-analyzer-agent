<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>CRE Analyzer – Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin:0; background:#f5f7fa; }
    header { background:#0b2e4a; color:#fff; padding:14px 20px; }
    header h1 { margin:0; font-size:18px; }
    main { padding:16px 20px; max-width:1200px; margin:auto; }
    .grid { display:grid; grid-template-columns:420px 1fr; gap:16px; }
    @media (max-width:900px){ .grid{grid-template-columns:1fr;} }
    .card { background:#fff; border-radius:10px; border:1px solid #e1e6eb; }
    .card h2 { font-size:14px; margin:0; padding:12px; border-bottom:1px solid #eef2f6; }
    .card .body { padding:12px; }
    label { font-size:12px; display:block; margin-top:8px; }
    input, select {
      width:100%; padding:8px; margin-top:4px;
      border:1px solid #ccd6dd; border-radius:6px;
      font-size:13px;
    }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
    button {
      margin-top:12px; padding:10px 14px;
      border:0; border-radius:8px;
      font-weight:bold; cursor:pointer;
    }
    .primary { background:#1363a5; color:#fff; }
    .status { margin-top:10px; font-size:12px; padding:8px; border-radius:6px; background:#eef3f7; }
    .ok { background:#e9f7ef; }
    .err { background:#fdecea; }

    /* memo */
    .summary {
      padding:12px;
      background:#f8fafc;
      border-bottom:1px solid #e1e6eb;
      font-size:12px;
      line-height:1.45;
    }
    .summary strong { color:#1b2a33; }
    .summary .pill {
      display:inline-block; padding:2px 8px;
      border-radius:999px; font-size:11px;
      background:#e7edf3; margin-right:6px;
    }
    .memo h3 {
      margin:0; padding:10px 12px;
      font-size:13px; background:#f0f4f8;
      border-top:1px solid #e1e6eb;
    }
    .memo p {
      margin:0; padding:12px;
      font-size:13px; line-height:1.45;
      white-space:pre-wrap;
    }
    details summary {
      cursor:pointer; font-size:12px; padding:8px;
      background:#f6f8fb; border-top:1px solid #e1e6eb;
    }
    pre { margin:0; padding:12px; font-size:12px; background:#fafbfc; overflow:auto; }
  </style>
</head>
<body>
<header>
  <h1>Commercial Real Estate Analyzer – by AI-lluminati</h1>
</header>

<main>
  <div class="grid">
    <div class="card">
      <h2>Deal Inputs</h2>
      <div class="body">
        <label>Deal ID</label>
        <input id="dealId" value="WF-DEMO-001"/>

        <label>Borrower</label>
        <input id="borrower" value="Acme Real Estate Holdings LLC"/>

        <label>Address</label>
        <input id="address" value="201 S Tryon St, Charlotte, NC 28202"/>

        <div class="row">
          <div>
            <label>Property Type</label>
            <select id="ptype">
              <option>Office</option><option>Industrial</option>
              <option>Retail</option><option>Multifamily</option>
            </select>
          </div>
          <div>
            <label>Year Built</label>
            <input id="year" type="number" value="2008"/>
          </div>
        </div>

        <div class="row3">
          <div><label>NRSF</label><input id="nrsf" type="number" value="185000"/></div>
          <div><label>Occupancy</label><input id="occ" type="number" step="0.01" value="0.86"/></div>
          <div><label>NOI</label><input id="noi" type="number" value="8200000"/></div>
        </div>

        <label>Loan Amount</label>
        <input id="loan" type="number" value="65000000"/>

        <div class="row">
          <div><label>Rate</label><input id="rate" type="number" step="0.0001" value="0.0675"/></div>
          <div><label>DSCR Covenant</label><input id="dscr" type="number" step="0.01" value="1.25"/></div>
        </div>

        <button class="primary" onclick="run()">Generate Deal Memo</button>
        <div id="status" class="status">Ready</div>

        <!-- Progress Bar (shown while backend runs) -->
        <div id="progressContainer" style="display:none; margin-top:12px;">
          <div style="font-size:12px; margin-bottom:6px;">
            Processing… <span id="progressPercent">0%</span>
          </div>
          <div style="width:100%; background:#e5e7eb; border-radius:6px; overflow:hidden;">
            <div id="progressBar" style="width:0%; height:10px; background:#1363a5; transition: width 0.3s ease;"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="card memo">
      <h2>Deal Memo</h2>

      <div class="summary" id="inputSummary"></div>

      <h3>Executive Summary</h3>
      <p id="exec"></p>

      <h3>Property Overview</h3>
      <p id="prop"></p>

      <h3>Market & Demographics</h3>
      <p id="market"></p>

      <h3>Regulatory / Environmental Risk</h3>
      <p id="risk"></p>

      <h3>Financial Scenarios</h3>
      <p id="fin"></p>

      <h3>Collateral Valuation</h3>
      <p id="val"></p>

      <h3>Recommendation</h3>
      <p id="rec"></p>

      <details>
        <summary>Show raw JSON response</summary>
        <pre id="raw"></pre>
      </details>
    </div>
  </div>
</main>

<script>
let progressInterval = null;
let progressValue = 0;

function startProgressBar(){
  progressValue = 0;
  const pc = document.getElementById("progressContainer");
  const pb = document.getElementById("progressBar");
  const pp = document.getElementById("progressPercent");
  if(!pc || !pb || !pp) return;

  pb.style.width = "0%";
  pp.textContent = "0%";
  pc.style.display = "block";

  if(progressInterval) clearInterval(progressInterval);
  progressInterval = setInterval(() => {
    // Simulate progress up to 90% while the backend is running
    if (progressValue < 90) {
      progressValue += Math.floor(Math.random() * 5) + 1;
      if (progressValue > 90) progressValue = 90;
      pb.style.width = progressValue + "%";
      pp.textContent = progressValue + "%";
    }
  }, 400);
}

function stopProgressBar(){
  const pc = document.getElementById("progressContainer");
  const pb = document.getElementById("progressBar");
  const pp = document.getElementById("progressPercent");
  if(!pc || !pb || !pp) return;

  if(progressInterval){
    clearInterval(progressInterval);
    progressInterval = null;
  }

  // Complete to 100% and then hide
  pb.style.width = "100%";
  pp.textContent = "100%";
  setTimeout(() => { pc.style.display = "none"; }, 450);
}

function setRunEnabled(enabled){
  const btn = document.querySelector('button.primary[onclick="run()"]');
  if(!btn) return;
  btn.disabled = !enabled;
  btn.style.opacity = enabled ? "1" : "0.7";
  btn.style.cursor = enabled ? "pointer" : "not-allowed";
}

function payload(){
  return {
    dealId: dealId.value,
    borrowerName: borrower.value,
    property:{
      address: address.value,
      propertyType: ptype.value,
      yearBuilt:+year.value,
      netRentableSqFt:+nrsf.value,
      occupancyPct:+occ.value,
      noiAnnual:+noi.value,
      capexHoldback:750000
    },
    loan:{
      requestedLoanAmount:+loan.value,
      interestRatePct:+rate.value,
      amortizationYears:25,
      termYears:7,
      dscrCovenant:+dscr.value
    },
    assumptions:{
      stressVacancyAddlPct:0.08,
      stressNoiDownPct:0.12,
      exitCapRatePct:0.075
    }
  };
}

function renderSummary(p){
  inputSummary.innerHTML = `
    <span class="pill"><strong>Deal:</strong> ${p.dealId}</span>
    <span class="pill"><strong>Borrower:</strong> ${p.borrowerName}</span><br/>
    <strong>Property:</strong> ${p.property.propertyType}, ${p.property.netRentableSqFt.toLocaleString()} SF,
    ${(p.property.occupancyPct*100).toFixed(0)}% occupied, NOI $${p.property.noiAnnual.toLocaleString()}<br/>
    <strong>Loan:</strong> $${p.loan.requestedLoanAmount.toLocaleString()} @ ${(p.loan.interestRatePct*100).toFixed(2)}%,
    DSCR covenant ${p.loan.dscrCovenant.toFixed(2)}
  `;
}

async function run(){
  setRunEnabled(false);
  startProgressBar();
  status.textContent="Calling agent...";
  status.className="status";
  try{
    const p = payload();
    renderSummary(p);

    const r = await fetch("/api/cre/analyze",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(p)
    });
    const t = await r.text();
    if(!r.ok) throw t;
    const j = JSON.parse(t);

    exec.textContent   = j.memo.executiveSummary || "";
    prop.textContent   = j.memo.propertyOverview || "";
    market.textContent = j.memo.marketAndDemographics || "";
    risk.textContent   = j.memo.regulatoryAndEnvironmentalRisk || "";
    fin.textContent    = j.memo.financialScenarios || "";
    val.textContent    = j.memo.collateralValuation || "";
    rec.textContent    = j.memo.recommendation || "";

    raw.textContent = JSON.stringify(j, null, 2);

    status.textContent="Success";
    status.className="status ok";
  }catch(e){
    status.textContent="Error: "+e;
    status.className="status err";
  }finally{
    stopProgressBar();
    setRunEnabled(true);
  }
}
</script>
</body>
</html>
